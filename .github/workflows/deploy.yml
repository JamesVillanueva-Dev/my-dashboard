name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run test:run

      # Both integrations are optional — an unset value just leaves that feature
      # invisible, so the build succeeds either way. Anything prefixed `VITE_`
      # is inlined into the bundle, so these belong in repo *variables*:
      # publishable keys and OAuth client ids are public by design. The
      # `secrets` fallback is only so a value added under the wrong tab still
      # works rather than failing silently.
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}

      # Fail loudly rather than shipping a build with sign-in silently missing.
      - name: Report which integrations were built in
        run: |
          grep -q 'pk_test_[A-Za-z0-9]\|pk_live_[A-Za-z0-9]' dist/assets/*.js \
            && echo "Clerk: enabled" \
            || echo "::warning::Clerk sign-in is NOT in this build — set the VITE_CLERK_PUBLISHABLE_KEY repository variable and re-run."
          grep -q 'apps.googleusercontent.com' dist/assets/*.js \
            && echo "Google Calendar: enabled" \
            || echo "::warning::Google Calendar sync is NOT in this build — set the VITE_GOOGLE_CLIENT_ID repository variable and re-run."

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
