<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <!-- viewport-fit=cover lets the page use the full display on notched phones.
         It is only safe because the layout pays the safe-area insets back with
         env() padding — see --page-pad and the nav bar in src/styles.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Dashboard</title>
    <meta
      name="description"
      content="Your whole day, on one page. Tasks, calendar, weather, news, mail and more, arranged yourself and run entirely in your browser."
    />
    <link rel="canonical" href="https://jamesvillanueva-dev.github.io/my-dashboard/" />

    <!-- Social link previews (Open Graph + Twitter Card) for the signed-out
         landing page, the one view of this app anyone outside an invited
         account will ever see. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dashboard" />
    <meta property="og:title" content="Dashboard — your whole day, on one page." />
    <meta
      property="og:description"
      content="Tasks, calendar, weather, news, mail and more, arranged yourself and run entirely in your browser. No server, no cost."
    />
    <meta property="og:url" content="https://jamesvillanueva-dev.github.io/my-dashboard/" />
    <meta property="og:image" content="https://jamesvillanueva-dev.github.io/my-dashboard/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dashboard — your whole day, on one page." />
    <meta
      name="twitter:description"
      content="Tasks, calendar, weather, news, mail and more, arranged yourself and run entirely in your browser."
    />
    <meta name="twitter:image" content="https://jamesvillanueva-dev.github.io/my-dashboard/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
